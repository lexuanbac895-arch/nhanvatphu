<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rổ Phim - Xem Phim Online Chất Lượng Cao</title>

    <link rel="dns-prefetch" href="https://phimimg.com">
    <link rel="dns-prefetch" href="https://phimapi.com">

    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #131b2e;
            --glass-bg: rgba(19, 27, 46, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-yellow: #ffcc00;
            --primary-cobalt: #0055ff;
            --accent-gradient: linear-gradient(135deg, #ffcc00 0%, #0055ff 100%);
            --cobalt-gradient: linear-gradient(135deg, #2563eb 0%, #0044cc 100%);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; overflow-x: hidden; }

        /* Header Hiện Đại */
        header { position: sticky; top: 0; z-index: 1000; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .logo { font-size: 22px; font-weight: 900; text-decoration: none; letter-spacing: -0.5px; text-transform: uppercase; display: flex; align-items: center; gap: 4px; }
        .logo .yellow { color: var(--primary-yellow); }
        .logo .cobalt { color: var(--primary-cobalt); text-shadow: 0 0 12px rgba(0, 85, 255, 0.6); }

        .search-box { display: flex; align-items: center; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border); border-radius: 20px; padding: 6px 14px; flex-grow: 1; max-width: 220px; }
        .search-box input { border: none; background: transparent; color: #fff; outline: none; width: 100%; font-size: 13px; }
        .search-box button { border: none; background: transparent; color: var(--text-sub); cursor: pointer; font-size: 14px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

        /* Hero Banner Carousel */
        .hero-carousel { position: relative; width: 100%; border-radius: 20px; overflow: hidden; margin-bottom: 24px; background: #0f172a; border: 1px solid var(--glass-border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .hero-poster-wrapper { position: relative; width: 100%; height: 360px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .hero-bg-blur { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(30px) opacity(0.35); transform: scale(1.2); }
        .hero-main-img { position: relative; z-index: 2; height: 85%; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15); object-fit: cover; }
        
        .hero-info { padding: 16px; text-align: center; position: relative; z-index: 3; background: linear-gradient(0deg, #0f172a 80%, transparent 100%); margin-top: -40px; }
        .hero-title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .hero-subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 14px; }
        
        .hero-actions { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .btn-play { background: var(--cobalt-gradient); color: #fff; border: none; padding: 11px 26px; border-radius: 25px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 20px rgba(0, 85, 255, 0.4); }

        .hero-tags { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag-badge { background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--primary-yellow); }

        .hero-desc { font-size: 12px; color: var(--text-sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 600px; margin: 0 auto; }

        /* Khung Xem Phim & Player */
        #player-section { display: none; margin-bottom: 24px; background: var(--glass-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); box-shadow: 0 12px 40px rgba(0,0,0,0.8); }
        .video-box { position: relative; padding-top: 56.25%; background: #000; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .player-info { padding: 18px; }
        .movie-title-main { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 12px; }

        .server-container { margin: 16px 0; background: rgba(10, 14, 23, 0.6); padding: 14px; border-radius: 14px; border: 1px solid var(--glass-border); }
        .server-title { font-size: 12px; font-weight: 800; color: var(--primary-yellow); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        
        /* Hàng chọn Thuyết minh / Vietsub */
        .server-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .server-btn { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .server-btn.active { background: var(--cobalt-gradient); color: #fff; font-weight: 800; border-color: transparent; box-shadow: 0 0 15px rgba(0, 85, 255, 0.5); }

        /* Lưới chọn Tập Phim */
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; max-height: 200px; overflow-y: auto; padding-right: 4px; }
        .ep-btn { background: rgba(255, 255, 255, 0.06); color: #fff; border: 1px solid rgba(255,255,255,0.08); padding: 10px 0; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: 0.2s; }
        .ep-btn.active { background: var(--primary-yellow); color: #000; font-weight: 900; border-color: var(--primary-yellow); box-shadow: 0 0 12px rgba(255, 204, 0, 0.4); }

        /* Lưới Phim */
        .section-title { font-size: 18px; font-weight: 800; margin: 20px 0 14px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary-cobalt); border-radius: 2px; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        @media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; } }

        .movie-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border); cursor: pointer; position: relative; transition: transform 0.2s; }
        .movie-card:active { transform: scale(0.96); }
        
        .poster-box { position: relative; padding-top: 145%; background: #0f172a; overflow: hidden; }
        .poster-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        .badge-hd { position: absolute; top: 6px; right: 6px; background: var(--primary-cobalt); color: #fff; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        
        .movie-info { padding: 8px; }
        .movie-name { font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Bottom Nav Bar */
        .bottom-nav { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: rgba(19, 27, 46, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 30px; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); text-decoration: none; font-size: 10px; font-weight: 600; gap: 3px; cursor: pointer; }
        .nav-item.active { color: var(--primary-yellow); }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }

        .loader { text-align: center; padding: 40px; color: var(--text-sub); font-size: 13px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="loadHome()">
            <span class="yellow">RỔ</span><span class="cobalt">PHIM</span>
        </a>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm tên phim..." onkeypress="if(event.key==='Enter') searchMovie()">
            <button onclick="searchMovie()">🔍</button>
        </div>
    </header>

    <div class="container">
        <!-- Hero Banner Carousel -->
        <div id="heroBanner" class="hero-carousel" style="display: none;">
            <div class="hero-poster-wrapper">
                <div id="heroBgBlur" class="hero-bg-blur"></div>
                <img id="heroImg" class="hero-main-img" src="" alt="Poster">
            </div>
            <div class="hero-info">
                <h1 class="hero-title" id="heroTitle">--</h1>
                <div class="hero-subtitle" id="heroSubTitle">--</div>
                
                <div class="hero-actions">
                    <button class="btn-play" id="heroPlayBtn">▶ Xem ngay</button>
                </div>

                <div class="hero-tags" id="heroTags"></div>
                <div class="hero-desc" id="heroDesc">--</div>
            </div>
        </div>

        <!-- Player Xem Phim -->
        <div id="player-section">
            <div class="video-box" id="videoBox"></div>
            <div class="player-info">
                <h2 class="movie-title-main" id="playerTitle">--</h2>

                <div class="server-container">
                    <div class="server-title">🌐 Chọn Bản Phim / Định Dạng:</div>
                    <div class="server-list" id="serverList"></div>

                    <div class="server-title" style="margin-top:12px;">🎬 Chọn Tập Phim:</div>
                    <div class="episodes-grid" id="episodesList"></div>
                </div>
            </div>
        </div>

        <!-- Danh sách Phim -->
        <div id="contentArea">
            <div class="section-title" id="gridTitle">Phim Mới Cập Nhật</div>
            <div class="movie-grid" id="movieGrid"></div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="loadHome()">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Trang chủ</span>
        </div>
        <div class="nav-item" onclick="document.getElementById('searchInput').focus()">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Tìm kiếm</span>
        </div>
    </div>

    <script>
        const API_BASE = 'https://phimapi.com';

        let currentMovieData = null;

        // Fix link ảnh chuẩn CDN KKPhim
        function formatImg(thumb) {
            if (!thumb) return 'https://via.placeholder.com/300x450?text=No+Cover';
            if (thumb.startsWith('http://') || thumb.startsWith('https://')) return thumb;
            return 'https://phimimg.com/' + (thumb.startsWith('/') ? thumb.slice(1) : thumb);
        }

        async function loadHome() {
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('gridTitle').innerText = 'Phim Mới Cập Nhật';
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<div class="loader">Đang tải danh sách phim...</div>';

            try {
                const res = await fetch(`${API_BASE}/danh-sach/phim-moi-cap-nhat?page=1`);
                const data = await res.json();
                const items = data.items || [];
                
                if (items.length > 0) {
                    setupHero(items[0]);
                    renderMovies(items);
                }
            } catch (err) {
                grid.innerHTML = '<div class="loader">Không thể tải dữ liệu! Vui lòng thử lại sau.</div>';
            }
        }

        async function setupHero(item) {
            const hero = document.getElementById('heroBanner');
            hero.style.display = 'block';

            try {
                const res = await fetch(`${API_BASE}/phim/${item.slug}`);
                const data = await res.json();
                const movie = data.movie || item;

                const imgUrl = formatImg(movie.poster_url || movie.thumb_url);
                document.getElementById('heroBgBlur').style.backgroundImage = `url(${imgUrl})`;
                document.getElementById('heroImg').src = imgUrl;
                document.getElementById('heroTitle').innerText = movie.name;
                document.getElementById('heroSubTitle').innerText = movie.origin_name || '';
                
                document.getElementById('heroTags').innerHTML = `
                    <span class="tag-badge">📅 ${movie.year || '2026'}</span>
                    <span class="tag-badge">🎬 ${movie.quality || 'HD'}</span>
                    <span class="tag-badge">🔊 ${movie.lang || 'Vietsub'}</span>
                `;

                document.getElementById('heroDesc').innerText = movie.content?.replace(/<[^>]*>?/gm, '') || 'Nội dung đang được cập nhật...';
                document.getElementById('heroPlayBtn').onclick = () => loadMovieDetails(movie.slug);
            } catch(e) {
                document.getElementById('heroImg').src = formatImg(item.thumb_url);
                document.getElementById('heroTitle').innerText = item.name;
                document.getElementById('heroPlayBtn').onclick = () => loadMovieDetails(item.slug);
            }
        }

        function renderMovies(items) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => loadMovieDetails(item.slug);
                
                const thumb = formatImg(item.poster_url || item.thumb_url);

                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${thumb}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x220?text=No+Image'">
                        <span class="badge-hd">${item.quality || 'HD'}</span>
                    </div>
                    <div class="movie-info">
                        <div class="movie-name">${item.name}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('heroBanner').style.display = 'none';
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('gridTitle').innerText = `Kết quả: "${query}"`;
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<div class="loader">Đang tìm kiếm...</div>';

            try {
                const res = await fetch(`${API_BASE}/v1/api/tim-kiem?keyword=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderMovies(data.data?.items || []);
            } catch (err) {
                grid.innerHTML = '<div class="loader">Không tìm thấy phim phù hợp!</div>';
            }
        }

        // Tải Phim và render Server/Tập
        async function loadMovieDetails(slug) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('heroBanner').style.display = 'none';
            const playerSec = document.getElementById('player-section');
            playerSec.style.display = 'block';
            
            document.getElementById('playerTitle').innerText = 'Đang tải danh sách tập...';
            document.getElementById('serverList').innerHTML = '';
            document.getElementById('episodesList').innerHTML = '';

            try {
                const res = await fetch(`${API_BASE}/phim/${slug}`);
                const data = await res.json();
                currentMovieData = data;

                const movie = data.movie;
                const servers = data.episodes || [];

                document.getElementById('playerTitle').innerText = movie.name;

                const serverListEl = document.getElementById('serverList');
                serverListEl.innerHTML = '';

                servers.forEach((server, index) => {
                    const btn = document.createElement('button');
                    btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = server.server_name || `Nguồn ${index + 1}`;
                    btn.onclick = () => selectServer(index);
                    serverListEl.appendChild(btn);
                });

                if (servers.length > 0) {
                    selectServer(0);
                }

            } catch (err) {
                document.getElementById('playerTitle').innerText = 'Lỗi tải video phim!';
            }
        }

        function selectServer(serverIndex) {
            document.querySelectorAll('.server-btn').forEach((b, i) => {
                b.classList.toggle('active', i === serverIndex);
            });

            const server = currentMovieData.episodes[serverIndex];
            const episodes = server?.server_data || [];
            const epList = document.getElementById('episodesList');
            epList.innerHTML = '';

            episodes.forEach((ep, index) => {
                const btn = document.createElement('button');
                btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = ep.name;
                btn.onclick = () => playVideo(ep.link_embed, btn);
                epList.appendChild(btn);
            });

            if (episodes.length > 0) {
                playVideo(episodes[0].link_embed, epList.children[0]);
            }
        }

        function playVideo(embedUrl, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const videoBox = document.getElementById('videoBox');
            
            if (embedUrl) {
                videoBox.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
            } else {
                videoBox.innerHTML = `<div style="color:#fff; text-align:center; padding-top:20%;">Link phim đang bảo trì!</div>`;
            }
        }

        loadHome();
    </script>
</body>
</html>
