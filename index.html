<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Netflix Clone - Xem Phim Online</title>

    <link rel="dns-prefetch" href="https://phimimg.com">
    <link rel="dns-prefetch" href="https://phimapi.com">

    <style>
        :root {
            --bg-main: #141414;
            --bg-card: #181818;
            --netflix-red: #E50914;
            --netflix-red-hover: #b81d24;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; overflow-x: hidden; }

        /* Header Netflix Style */
        header { position: sticky; top: 0; z-index: 1000; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.8) 100%); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo { font-size: 24px; font-weight: 900; text-decoration: none; color: var(--netflix-red); letter-spacing: -0.5px; text-transform: uppercase; font-family: 'Arial Black', Impact, sans-serif; }

        .search-box { display: flex; align-items: center; background: rgba(0, 0, 0, 0.75); border: 1px solid var(--glass-border); border-radius: 4px; padding: 6px 12px; flex-grow: 1; max-width: 240px; }
        .search-box input { border: none; background: transparent; color: #fff; outline: none; width: 100%; font-size: 13px; }
        .search-box button { border: none; background: transparent; color: var(--text-sub); cursor: pointer; font-size: 14px; }

        .container { max-width: 1300px; margin: 0 auto; padding: 16px; }

        /* Hero Banner Netflix Style */
        .hero-carousel { position: relative; width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 28px; background: #000; border: 1px solid var(--glass-border); box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .hero-poster-wrapper { position: relative; width: 100%; height: 400px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .hero-bg-blur { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(20px) brightness(0.4); transform: scale(1.1); }
        .hero-main-img { position: relative; z-index: 2; height: 85%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); object-fit: cover; }
        
        .hero-info { padding: 20px; text-align: center; position: relative; z-index: 3; background: linear-gradient(180deg, transparent 0%, #141414 100%); margin-top: -60px; }
        .hero-title { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 6px; letter-spacing: -0.5px; }
        .hero-subtitle { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; }
        
        .hero-actions { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; }
        .btn-play { background: #ffffff; color: #000000; border: none; padding: 10px 28px; border-radius: 4px; font-weight: 900; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-play:active { background: #cccccc; }

        .hero-tags { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .tag-badge { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; color: #fff; }

        .hero-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 650px; margin: 0 auto; }

        /* Khung Xem Phim & Player */
        #player-section { display: none; margin-bottom: 28px; background: #181818; border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border); box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
        .video-box { position: relative; padding-top: 56.25%; background: #000; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .player-info { padding: 20px; }
        .movie-title-main { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 16px; }

        .server-container { background: #0f0f0f; padding: 16px; border-radius: 8px; border: 1px solid var(--glass-border); }
        .server-title { font-size: 12px; font-weight: 800; color: var(--netflix-red); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: space-between; }
        
        .btn-external { background: rgba(229, 9, 20, 0.2); color: #fff; border: 1px solid var(--netflix-red); font-size: 11px; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

        /* Chọn Server / Tập */
        .server-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .server-btn { background: #2f2f2f; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .server-btn.active { background: var(--netflix-red); color: #fff; font-weight: 900; }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
        .ep-btn { background: #2b2b2b; color: #fff; border: 1px solid rgba(255,255,255,0.05); padding: 10px 0; border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: 0.2s; }
        .ep-btn.active { background: var(--netflix-red); color: #fff; font-weight: 900; border-color: var(--netflix-red); }

        /* Lưới Phim Chuẩn Netflix */
        .section-title { font-size: 20px; font-weight: 800; margin: 24px 0 16px; color: #e5e5e5; display: flex; align-items: center; gap: 8px; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 12px; }
        @media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; } }

        .movie-card { background: var(--bg-card); border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease; border: 1px solid rgba(255,255,255,0.05); }
        .movie-card:active { transform: scale(0.95); }
        
        .poster-box { position: relative; padding-top: 145%; background: #1f1f1f; overflow: hidden; }
        .poster-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        .badge-hd { position: absolute; top: 6px; right: 6px; background: var(--netflix-red); color: #fff; font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 2px; }
        
        .movie-info { padding: 10px 8px; }
        .movie-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Bottom Nav Bar Netflix Style */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); text-decoration: none; font-size: 10px; font-weight: 600; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #ffffff; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        .loader { text-align: center; padding: 40px; color: var(--text-sub); font-size: 13px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="loadHome()">NETFLIX</a>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm kiếm phim..." onkeypress="if(event.key==='Enter') searchMovie()">
            <button onclick="searchMovie()">🔍</button>
        </div>
    </header>

    <div class="container">
        <!-- Hero Banner Carousel -->
        <div id="heroBanner" class="hero-carousel" style="display: none;">
            <div class="hero-poster-wrapper">
                <div id="heroBgBlur" class="hero-bg-blur"></div>
                <img id="heroImg" class="hero-main-img" src="" alt="Poster">
            </div>
            <div class="hero-info">
                <h1 class="hero-title" id="heroTitle">--</h1>
                <div class="hero-subtitle" id="heroSubTitle">--</div>
                
                <div class="hero-actions">
                    <button class="btn-play" id="heroPlayBtn">▶ Phát Phim</button>
                </div>

                <div class="hero-tags" id="heroTags"></div>
                <div class="hero-desc" id="heroDesc">--</div>
            </div>
        </div>

        <!-- Player Xem Phim -->
        <div id="player-section">
            <div class="video-box" id="videoBox"></div>
            <div class="player-info">
                <h2 class="movie-title-main" id="playerTitle">--</h2>

                <div class="server-container">
                    <div class="server-title">
                        <span>Định dạng & Vietsub / Thuyết Minh:</span>
                        <a id="externalLinkBtn" class="btn-external" href="#" target="_blank" style="display:none;">🚀 Mở Tab Dự Phòng</a>
                    </div>
                    <div class="server-list" id="serverList"></div>

                    <div class="server-title" style="margin-top:14px;">Danh sách tập phim:</div>
                    <div class="episodes-grid" id="episodesList"></div>
                </div>
            </div>
        </div>

        <!-- Danh sách Phim -->
        <div id="contentArea">
            <div class="section-title" id="gridTitle">Phim Mới Cập Nhật</div>
            <div class="movie-grid" id="movieGrid"></div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="loadHome()">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Trang chủ</span>
        </div>
        <div class="nav-item" onclick="document.getElementById('searchInput').focus()">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Tìm kiếm</span>
        </div>
    </div>

    <script>
        const API_BASE = 'https://phimapi.com';
        let currentMovieData = null;

        function formatImg(thumb) {
            if (!thumb) return 'https://via.placeholder.com/300x450?text=No+Cover';
            if (thumb.startsWith('http://') || thumb.startsWith('https://')) return thumb;
            return 'https://phimimg.com/' + (thumb.startsWith('/') ? thumb.slice(1) : thumb);
        }

        async function loadHome() {
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('gridTitle').innerText = 'Phim Mới Cập Nhật';
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<div class="loader">Đang tải...</div>';

            try {
                const res = await fetch(`${API_BASE}/danh-sach/phim-moi-cap-nhat?page=1`);
                const data = await res.json();
                const items = data.items || [];
                
                if (items.length > 0) {
                    setupHero(items[0]);
                    renderMovies(items);
                }
            } catch (err) {
                grid.innerHTML = '<div class="loader">Lỗi tải danh sách phim!</div>';
            }
        }

        async function setupHero(item) {
            const hero = document.getElementById('heroBanner');
            hero.style.display = 'block';

            try {
                const res = await fetch(`${API_BASE}/phim/${item.slug}`);
                const data = await res.json();
                const movie = data.movie || item;

                const imgUrl = formatImg(movie.poster_url || movie.thumb_url);
                document.getElementById('heroBgBlur').style.backgroundImage = `url(${imgUrl})`;
                document.getElementById('heroImg').src = imgUrl;
                document.getElementById('heroTitle').innerText = movie.name;
                document.getElementById('heroSubTitle').innerText = movie.origin_name || '';
                
                document.getElementById('heroTags').innerHTML = `
                    <span class="tag-badge">${movie.year || '2026'}</span>
                    <span class="tag-badge">${movie.quality || 'HD'}</span>
                    <span class="tag-badge">${movie.lang || 'Vietsub'}</span>
                `;

                document.getElementById('heroDesc').innerText = movie.content?.replace(/<[^>]*>?/gm, '') || 'Nội dung đang cập nhật...';
                document.getElementById('heroPlayBtn').onclick = () => loadMovieDetails(movie.slug);
            } catch(e) {
                document.getElementById('heroImg').src = formatImg(item.thumb_url);
                document.getElementById('heroTitle').innerText = item.name;
                document.getElementById('heroPlayBtn').onclick = () => loadMovieDetails(item.slug);
            }
        }

        function renderMovies(items) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => loadMovieDetails(item.slug);
                
                const thumb = formatImg(item.poster_url || item.thumb_url);

                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${thumb}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x220?text=No+Image'">
                        <span class="badge-hd">${item.quality || 'HD'}</span>
                    </div>
                    <div class="movie-info">
                        <div class="movie-name">${item.name}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('heroBanner').style.display = 'none';
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('gridTitle').innerText = `Kết quả tìm kiếm: "${query}"`;
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<div class="loader">Đang tìm kiếm...</div>';

            try {
                const res = await fetch(`${API_BASE}/v1/api/tim-kiem?keyword=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderMovies(data.data?.items || []);
            } catch (err) {
                grid.innerHTML = '<div class="loader">Không tìm thấy phim phù hợp!</div>';
            }
        }

        async function loadMovieDetails(slug) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('heroBanner').style.display = 'none';
            const playerSec = document.getElementById('player-section');
            playerSec.style.display = 'block';
            
            document.getElementById('playerTitle').innerText = 'Đang tải dữ liệu...';
            document.getElementById('serverList').innerHTML = '';
            document.getElementById('episodesList').innerHTML = '';

            try {
                const res = await fetch(`${API_BASE}/phim/${slug}`);
                const data = await res.json();
                currentMovieData = data;

                const movie = data.movie;
                const servers = data.episodes || [];

                document.getElementById('playerTitle').innerText = movie.name;

                const serverListEl = document.getElementById('serverList');
                serverListEl.innerHTML = '';

                servers.forEach((server, index) => {
                    const btn = document.createElement('button');
                    btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = server.server_name || `Nguồn ${index + 1}`;
                    btn.onclick = () => selectServer(index);
                    serverListEl.appendChild(btn);
                });

                if (servers.length > 0) {
                    selectServer(0);
                }

            } catch (err) {
                document.getElementById('playerTitle').innerText = 'Lỗi tải phim!';
            }
        }

        function selectServer(serverIndex) {
            document.querySelectorAll('.server-btn').forEach((b, i) => {
                b.classList.toggle('active', i === serverIndex);
            });

            const server = currentMovieData.episodes[serverIndex];
            const episodes = server?.server_data || [];
            const epList = document.getElementById('episodesList');
            epList.innerHTML = '';

            episodes.forEach((ep, index) => {
                const btn = document.createElement('button');
                btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = ep.name;
                btn.onclick = () => playVideo(ep.link_embed, ep.link_m3u8, btn);
                epList.appendChild(btn);
            });

            if (episodes.length > 0) {
                playVideo(episodes[0].link_embed, episodes[0].link_m3u8, epList.children[0]);
            }
        }

        function playVideo(embedUrl, m3u8Url, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const videoBox = document.getElementById('videoBox');
            const extBtn = document.getElementById('externalLinkBtn');

            if (embedUrl) {
                extBtn.style.display = 'inline-flex';
                extBtn.href = embedUrl;

                videoBox.innerHTML = `
                    <iframe 
                        src="${embedUrl}" 
                        allowfullscreen="true" 
                        webkitallowfullscreen="true" 
                        mozallowfullscreen="true"
                        allow="autoplay; encrypted-media; picture-in-picture"
                        style="width: 100%; height: 100%; border: none;">
                    </iframe>`;
            } else {
                videoBox.innerHTML = `<div style="color:#fff; text-align:center; padding-top:20%;">Link phim gặp sự cố!</div>`;
            }
        }

        loadHome();
    </script>
</body>
</html>
