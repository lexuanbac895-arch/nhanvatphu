<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rổ Phim Mini</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg-main: #0b0b0e; --bg-card: #16161c; --primary: #ff9900; --text-main: #ffffff; --text-sub: #aaaaaa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 50px; }
        header { position: sticky; top: 0; z-index: 1000; background: rgba(11, 11, 14, 0.95); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 20px; font-weight: 900; color: var(--primary); letter-spacing: 1px; cursor: pointer; }
        .logo span { color: #fff; }
        .search-box { display: flex; align-items: center; background: rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 4px 12px; width: 55%; max-width: 300px; }
        .search-box input { border: none; background: transparent; color: #fff; outline: none; width: 100%; padding: 6px; font-size: 13px; }
        .search-box button { border: none; background: transparent; color: var(--primary); font-weight: bold; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        .hero { position: relative; border-radius: 16px; overflow: hidden; margin: 15px 0 25px; height: 280px; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg-main) 0%, rgba(11,11,14,0.3) 60%, transparent 100%); }
        .hero-content { z-index: 2; padding: 20px; position: relative; }
        .hero-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .btn-play-hero { display: inline-block; background: var(--primary); color: #000; font-weight: bold; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4); }
        .player-wrapper { display: none; margin-bottom: 30px; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .video-box { position: relative; padding-top: 56.25%; background: #000; }
        .video-box video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .player-details { padding: 15px; background: var(--bg-card); }
        .episodes-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-height: 120px; overflow-y: auto; }
        .ep-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .ep-btn.active { background: var(--primary); color: #000; font-weight: bold; }
        .section-header { font-size: 16px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .section-header::before { content: ''; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        @media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; } }
        .movie-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .movie-card:active { transform: scale(0.96); }
        .poster-wrapper { position: relative; aspect-ratio: 2/3; overflow: hidden; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .badge-lang { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); color: var(--primary); font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 4px; }
        .movie-info { padding: 8px; }
        .movie-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
        .pagination { display: flex; justify-content: center; gap: 12px; margin-top: 25px; }
        .pagination button { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.reload()">RỔ<span>PHIM</span></div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm phim...">
            <button onclick="searchMovie()">🔍</button>
        </div>
    </header>
    <div class="container">
        <div class="hero" id="hero-banner" style="display: none;">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-title" id="hero-title">--</div>
                <div class="btn-play-hero" id="hero-play-btn">▶ Xem Ngay</div>
            </div>
        </div>
        <div class="player-wrapper" id="player-wrapper">
            <div class="video-box">
                <video id="video-player" controls playsinline></video>
            </div>
            <div class="player-details">
                <h2 id="player-title" style="font-size: 16px; margin-bottom: 8px;">--</h2>
                <div style="font-size: 12px; color: var(--text-sub);">Chọn tập phim:</div>
                <div class="episodes-grid" id="episodes-list"></div>
            </div>
        </div>
        <div class="section-header" id="section-title">Phim Mới Cập Nhật</div>
        <div class="movie-grid" id="movie-grid"></div>
        <div class="pagination">
            <button onclick="changePage(-1)">Trang trước</button>
            <button onclick="changePage(1)">Trang sau</button>
        </div>
    </div>
    <script>
        const API_DOMAIN = 'https://ophim1.com';
        const CDN_IMAGE = 'https://img.ophim.live/uploads/movies/';
        let currentPage = 1, hlsInstance = null;
        async function fetchMovies(page = 1) {
            try {
                const res = await fetch(`${API_DOMAIN}/danh-sach/phim-moi-cap-nhat?page=${page}`);
                const data = await res.json();
                if (data.items.length > 0 && page === 1) setupHero(data.items[0]);
                renderGrid(data.items);
            } catch (err) {}
        }
        function setupHero(movie) {
            const hero = document.getElementById('hero-banner');
            const thumb = movie.thumb_url.startsWith('http') ? movie.thumb_url : `${CDN_IMAGE}${movie.thumb_url}`;
            hero.style.backgroundImage = `url('${thumb}')`;
            document.getElementById('hero-title').innerText = movie.name;
            document.getElementById('hero-play-btn').onclick = () => playMovie(movie.slug);
            hero.style.display = 'flex';
        }
        function renderGrid(movies) {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            movies.forEach(movie => {
                const thumb = movie.thumb_url.startsWith('http') ? movie.thumb_url : `${CDN_IMAGE}${movie.thumb_url}`;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `<div class="poster-wrapper"><img src="${thumb}" alt="${movie.name}" loading="lazy"><div class="badge-lang">HD</div></div><div class="movie-info"><div class="movie-title">${movie.name}</div></div>`;
                card.onclick = () => playMovie(movie.slug);
                grid.appendChild(card);
            });
        }
        async function playMovie(slug) {
            const wrapper = document.getElementById('player-wrapper');
            wrapper.style.display = 'block';
            wrapper.scrollIntoView({ behavior: 'smooth' });
            try {
                const res = await fetch(`${API_DOMAIN}/phim/${slug}`);
                const data = await res.json();
                document.getElementById('player-title').innerText = data.movie.name;
                const epContainer = document.getElementById('episodes-list');
                epContainer.innerHTML = '';
                if (data.episodes && data.episodes[0].server_data) {
                    const eps = data.episodes[0].server_data;
                    eps.forEach((ep, idx) => {
                        const btn = document.createElement('button');
                        btn.className = `ep-btn ${idx === 0 ? 'active' : ''}`;
                        btn.innerText = ep.name;
                        btn.onclick = () => {
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            startStream(ep.link_m3u8);
                        };
                        epContainer.appendChild(btn);
                    });
                    startStream(eps[0].link_m3u8);
                }
            } catch (err) { alert('Lỗi tải video!'); }
        }
        function startStream(url) {
            const video = document.getElementById('video-player');
            if (Hls.isSupported()) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play());
            }
        }
        async function searchMovie() {
            const q = document.getElementById('search-input').value.trim();
            if (!q) return;
            document.getElementById('section-title').innerText = `Kết quả: "${q}"`;
            document.getElementById('hero-banner').style.display = 'none';
            try {
                const res = await fetch(`${API_DOMAIN}/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}`);
                const data = await res.json();
                renderGrid(data.data.items || []);
            } catch (err) {}
        }
        function changePage(delta) {
            if (currentPage + delta < 1) return;
            currentPage += delta;
            fetchMovies(currentPage);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        fetchMovies(currentPage);
    </script>
</body>
</html>
