<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIA HÀ NỘI - Multi-Source Selector</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #070707; --gold: #ffc72c; --red: #e50914; --glass: rgba(255,255,255,0.05); }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding-bottom: 80px; }
        .container { padding: 15px; }
        .source-selector { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding: 5px; }
        .btn-source { background: #222; border: 1px solid #444; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 12px; }
        .btn-source.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }
        .movie-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #111; border-radius: 8px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-title { padding: 10px; font-size: 13px; font-weight: bold; }
        /* Player styles */
        #player-section { display: none; }
        .video-box { width: 100%; background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        iframe, video { width: 100%; height: 100%; border: none; }
        .ep-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .btn-ep { background: #222; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .btn-ep.active { background: var(--red); }
    </style>
</head>
<body>
    <div class="container">
        <h3>Chọn nguồn phim:</h3>
        <div class="source-selector">
            <button class="btn-source active" onclick="changeSource('OPHIM', this)">Ophim</button>
            <button class="btn-source" onclick="changeSource('KKPHIM', this)">KKPhim</button>
            <button class="btn-source" onclick="changeSource('VSMOV', this)">VSMov</button>
        </div>
        
        <div id="search-box" style="margin-bottom: 15px;">
            <input type="text" id="searchInput" placeholder="Tìm phim...">
            <button onclick="searchMovie()">Tìm</button>
        </div>

        <div id="mainContent" class="movie-grid"></div>
        <div id="player-section">
            <div class="video-box" id="videoBox"></div>
            <div id="epList" class="ep-list"></div>
        </div>
    </div>

    <script>
        let currentSource = 'OPHIM'; // Mặc định
        const API_MAP = {
            'OPHIM': { base: 'https://ophim1.com', img: 'https://img.ophim.live/uploads/movies/' },
            'KKPHIM': { base: 'https://phimapi.com', img: 'https://phimimg.com/uploads/movies/' },
            'VSMOV': { base: 'https://vsmov.com/api', img: '' }
        };

        function removeTones(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();
        }

        function changeSource(source, btn) {
            currentSource = source;
            document.querySelectorAll('.btn-source').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadHome();
        }

        async function fetchAPI(path, isSearch = false, query = '') {
            let url = '';
            if (isSearch) {
                const slug = removeTones(query).replace(/\s+/g, '-');
                if (currentSource === 'VSMOV') url = `${API_MAP.VSMOV.base}/tim-kiem?keyword=${query}`;
                else url = `${API_MAP[currentSource].base}/v1/api/tim-kiem?keyword=${slug}`;
            } else {
                if (currentSource === 'VSMOV') url = `${API_MAP.VSMOV.base}${path}`;
                else url = `${API_MAP[currentSource].base}/v1/api${path}`;
            }
            
            try {
                const res = await fetch(url);
                return await res.json();
            } catch(e) { return null; }
        }

        async function loadHome() {
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('mainContent').style.display = 'grid';
            const data = await fetchAPI('/danh-sach/phim-moi-cap-nhat?page=1');
            renderMovies(data?.items || data?.data?.items || []);
        }

        function renderMovies(items) {
            const grid = document.getElementById('mainContent');
            grid.innerHTML = '';
            items.forEach(m => {
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => loadDetail(m.slug);
                div.innerHTML = `<img src="${m.thumb_url || (API_MAP[currentSource].img + m.poster_url)}"><div class="card-title">${m.name}</div>`;
                grid.appendChild(div);
            });
        }

        async function loadDetail(slug) {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('player-section').style.display = 'block';
            const data = await fetchAPI(`/phim/${slug}`);
            const movie = data.movie || data;
            const eps = data.episodes || [];
            
            const epContainer = document.getElementById('epList');
            epContainer.innerHTML = '';
            eps[0]?.server_data.forEach(ep => {
                const b = document.createElement('div');
                b.className = 'btn-ep';
                b.innerText = ep.name;
                b.onclick = () => {
                    document.getElementById('videoBox').innerHTML = `<iframe src="${ep.link_embed}"></iframe>`;
                    document.querySelectorAll('.btn-ep').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                };
                epContainer.appendChild(b);
            });
        }

        async function searchMovie() {
            const q = document.getElementById('searchInput').value;
            if(!q) return;
            const data = await fetchAPI('', true, q);
            renderMovies(data?.items || data?.data?.items || []);
        }

        loadHome();
    </script>
</body>
</html>
