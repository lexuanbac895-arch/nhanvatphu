<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rổ Phim - Xem Phim Online Chất Lượng Cao</title>

    <!-- Preconnect tối ưu tốc độ tải video & API -->
    <link rel="dns-prefetch" href="https://ophim17.cc">
    <link rel="dns-prefetch" href="https://phimapi.com">
    <link rel="dns-prefetch" href="https://img.ophim.live">
    <link rel="dns-prefetch" href="https://phimimg.com">

    <style>
        :root {
            --bg-main: #0d0d0f;
            --bg-card: rgba(255, 255, 255, 0.05);
            --glass-bg: rgba(22, 22, 28, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-glow: rgba(229, 9, 20, 0.35);
            --accent: #e50914;
            --accent-gold: #ffb400;
            --text-main: #ffffff;
            --text-sub: #a0a0ab;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 50px; overflow-x: hidden; }

        /* Header Kính Lỏng (Glassmorphism) */
        header { position: sticky; top: 0; z-index: 1000; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--glass-border); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo { font-size: 22px; font-weight: 900; color: var(--accent); text-decoration: none; letter-spacing: -0.5px; text-transform: uppercase; }
        .logo span { color: #fff; }

        .search-box { display: flex; align-items: center; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); border-radius: 20px; padding: 6px 14px; flex-grow: 1; max-width: 280px; backdrop-filter: blur(10px); }
        .search-box input { border: none; background: transparent; color: #fff; outline: none; width: 100%; font-size: 13px; }
        .search-box button { border: none; background: transparent; color: var(--text-sub); cursor: pointer; }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

        /* Banner Phim Nổi Bật (Khung Hero giống Rổ Phim) */
        .hero-banner { position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 24px; min-height: 220px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 20px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(13,13,15,1) 0%, rgba(13,13,15,0.4) 60%, rgba(0,0,0,0.1) 100%); }
        .hero-content { position: relative; z-index: 2; max-width: 600px; }
        .hero-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .hero-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 25px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4); transition: transform 0.2s, box-shadow 0.2s; }
        .hero-btn:active { transform: scale(0.95); }

        /* Khung Phát Video & Thông Tin Phim */
        #player-section { display: none; margin-bottom: 24px; background: var(--glass-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); box-shadow: 0 12px 40px rgba(0,0,0,0.7); }
        .video-box { position: relative; padding-top: 56.25%; background: #000; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .player-info { padding: 18px; }
        .movie-title-main { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .movie-meta-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }
        .meta-tag { background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 4px; color: var(--text-sub); }

        /* Phân Loại Server Thuyết Minh / Vietsub */
        .server-container { margin: 14px 0; }
        .server-title { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .server-list { display: flex; gap: 8px; flex-wrap: wrap; }
        .server-btn { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--glass-border); padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .server-btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--glass-glow); }

        /* Danh Sách Tập Phim */
        .episodes-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 160px; overflow-y: auto; padding-right: 4px; margin-top: 10px; }
        .ep-btn { background: rgba(255, 255, 255, 0.06); color: #fff; border: 1px solid rgba(255,255,255,0.05); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .ep-btn.active { background: #fff; color: #000; font-weight: 800; }

        /* Thông tin Diễn Viên & Nội Dung Phim */
        .movie-details-box { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--glass-border); font-size: 13px; color: var(--text-sub); line-height: 1.6; }
        .details-row { margin-bottom: 6px; }
        .details-row strong { color: #fff; }

        /* Danh Sách Phim & HIỆU ỨNG KÍNH LỎNG NỔI (3D Hover Effect) */
        .section-title { font-size: 18px; font-weight: 800; margin: 24px 0 14px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 14px; }
        @media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 18px; } }

        /* Thẻ phim Kính Lỏng Nổi 3D */
        .movie-card { background: var(--glass-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border); cursor: pointer; position: relative; transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); transform-style: preserve-3d; perspective: 1000px; }
        .movie-card:hover, .movie-card:active { transform: translateY(-8px) scale(1.03); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8), 0 0 20px var(--glass-glow); }
        
        .poster-box { position: relative; padding-top: 145%; background: #1a1a1f; overflow: hidden; }
        .poster-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; content-visibility: auto; }
        .movie-card:hover .poster-box img { transform: scale(1.08); }

        /* Badge nhãn phim */
        .badge-hd { position: absolute; top: 8px; right: 8px; background: rgba(229, 9, 20, 0.9); backdrop-filter: blur(4px); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .badge-lang { position: absolute; bottom: 8px; left: 8px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); color: var(--accent-gold); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255, 180, 0, 0.3); }

        .movie-info { padding: 10px; }
        .movie-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .loader { text-align: center; padding: 50px; color: var(--text-sub); font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="loadHome()">RỔ<span>PHIM</span></a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm phim, diễn viên..." onkeypress="if(event.key==='Enter') searchMovie()">
            <button onclick="searchMovie()">🔍</button>
        </div>
    </header>

    <div class="container">
        <!-- Banner Hero xem ngay -->
        <div id="heroBanner" class="hero-banner" style="display: none;">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="hero-title" id="heroTitle">Tên Phim Nổi Bật</h1>
                <button class="hero-btn" id="heroPlayBtn">▶ Xem Ngay</button>
            </div>
        </div>

        <!-- Player & Thông Tin Phim Chi Tiết -->
        <div id="player-section">
            <div class="video-box" id="videoBox"></div>
            <div class="player-info">
                <h2 class="movie-title-main" id="playerTitle">Tên Phim</h2>
                <div class="movie-meta-tags" id="playerMeta"></div>

                <!-- Chọn Server Thuyết Minh / Vietsub -->
                <div class="server-container">
                    <div class="server-title">Chọn Nguồn / Bản Dịch:</div>
                    <div class="server-list" id="serverList"></div>
                </div>

                <!-- Chọn Tập -->
                <div class="server-title">Danh sách tập:</div>
                <div class="episodes-grid" id="episodesList"></div>

                <!-- Thông tin Nội dung & Diễn viên -->
                <div class="movie-details-box" id="movieDetailsBox"></div>
            </div>
        </div>

        <!-- Danh sách Phim -->
        <div id="contentArea">
            <div class="section-title" id="gridTitle">Phim Mới Cập Nhật</div>
            <div class="movie-grid" id="movieGrid"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ophim17.cc';
        const CDN_IMG = 'https://img.ophim.live/uploads/movies/';

        let currentMovieData = null;

        // Tải trang chủ & Phim nổi bật
        async function loadHome() {
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('gridTitle').innerText = 'Phim Mới Cập Nhật';
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<div class="loader">Đang tải danh sách phim...</div>';

            try {
                const res = await fetch(`${API_URL}/danh-sach/phim-moi-cap-nhat?page=1`);
                const data = await res.json();
                
                if(data.items && data.items.length > 0) {
                    setupHero(data.items[0]);
                    renderMovies(data.items);
                }
            } catch (err) {
                grid.innerHTML = '<div class="loader">Không thể tải danh sách phim!</div>';
            }
        }

        // Cấu hình Banner Hero "Xem Ngay"
        function setupHero(item) {
            const hero = document.getElementById('heroBanner');
            hero.style.display = 'flex';
            hero.style.backgroundImage = `url(${CDN_IMG}${item.thumb_url})`;
            document.getElementById('heroTitle').innerText = item.name;
            document.getElementById('heroPlayBtn').onclick = () => loadMovieDetails(item.slug);
        }

        // Render Danh sách Thẻ Phim
        function renderMovies(items) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const thumb = item.thumb_url.includes('http') ? item.thumb_url : `${CDN_IMG}${item.thumb_url}`;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => loadMovieDetails(item.slug);
                
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${thumb}" alt="${item.name}" loading="lazy">
                        <span class="badge-hd">${item.quality || 'HD'}</span>
                        ${item.lang ? `<span class="badge-lang">${item.lang}</span>` : ''}
                    </div>
                    <div class="movie-info">
                        <div class="movie-name">${item.name}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Tìm kiếm Phim
        async function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('heroBanner').style.display = 'none';
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('gridTitle').innerText = `Kết quả: "${query}"`;
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<div class="loader">Đang tìm kiếm...</div>';

            try {
                const res = await fetch(`${API_URL}/v1/api/tim-kiem?keyword=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderMovies(data.data.items);
            } catch (err) {
                grid.innerHTML = '<div class="loader">Không tìm thấy phim phù hợp!</div>';
            }
        }

        // Tải chi tiết Phim - Diễn viên - Thuyết minh / Vietsub
        async function loadMovieDetails(slug) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('heroBanner').style.display = 'none';
            const playerSec = document.getElementById('player-section');
            playerSec.style.display = 'block';
            
            document.getElementById('playerTitle').innerText = 'Đang tải dữ liệu phim...';
            document.getElementById('serverList').innerHTML = '';
            document.getElementById('episodesList').innerHTML = '';

            try {
                const res = await fetch(`${API_URL}/phim/${slug}`);
                const data = await res.json();
                currentMovieData = data;

                const movie = data.movie;
                const servers = data.episodes || [];

                document.getElementById('playerTitle').innerText = movie.name;
                
                // Hiển thị thẻ meta (Năm, Thời lượng, Quốc gia)
                document.getElementById('playerMeta').innerHTML = `
                    <span class="meta-tag">📅 ${movie.year || 'N/A'}</span>
                    <span class="meta-tag">⏱ ${movie.time || 'N/A'}</span>
                    <span class="meta-tag">🌐 ${movie.country?.[0]?.name || 'Nhiều quốc gia'}</span>
                `;

                // Hiển thị Chi Tiết Phim & Diễn Viên
                document.getElementById('movieDetailsBox').innerHTML = `
                    <div class="details-row"><strong>Diễn viên:</strong> ${movie.actor?.join(', ') || 'Đang cập nhật'}</div>
                    <div class="details-row"><strong>Đạo diễn:</strong> ${movie.director?.join(', ') || 'Đang cập nhật'}</div>
                    <div class="details-row" style="margin-top:8px;">${movie.content?.replace(/<[^>]*>?/gm, '') || 'Chưa có mô tả nội dung.'}</div>
                `;

                // Phân loại Server (Thuyết minh / Lồng tiếng / Vietsub)
                const serverListEl = document.getElementById('serverList');
                serverListEl.innerHTML = '';

                servers.forEach((server, index) => {
                    const btn = document.createElement('button');
                    btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerText = server.server_name || `Server ${index + 1}`;
                    btn.onclick = () => selectServer(index);
                    serverListEl.appendChild(btn);
                });

                if (servers.length > 0) {
                    selectServer(0);
                }

            } catch (err) {
                document.getElementById('playerTitle').innerText = 'Lỗi tải phim!';
            }
        }

        // Chọn Server
        function selectServer(serverIndex) {
            document.querySelectorAll('.server-btn').forEach((b, i) => {
                b.classList.toggle('active', i === serverIndex);
            });

            const server = currentMovieData.episodes[serverIndex];
            const episodes = server?.server_data || [];
            const epList = document.getElementById('episodesList');
            epList.innerHTML = '';

            episodes.forEach((ep, index) => {
                const btn = document.createElement('button');
                btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = ep.name;
                btn.onclick = () => playVideo(ep.link_embed, btn);
                epList.appendChild(btn);
            });

            if (episodes.length > 0) {
                playVideo(episodes[0].link_embed, epList.children[0]);
            }
        }

        // Phát Video siêu mượt bằng Iframe Embed (Tránh lỗi HLS / giật lag trên Safari iOS)
        function playVideo(embedUrl, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const videoBox = document.getElementById('videoBox');
            videoBox.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        }

        // Chạy ban đầu
        loadHome();
    </script>
</body>
</html>
